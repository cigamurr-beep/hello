<style>
/* Layout: sticky bar (brand · search · sort) → category chips → dense card grid; QC opens a full-screen lightbox */
:root {

* { box-sizing: border-box; }
html, body { margin: 0; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; padding-block: 4px 56px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }

.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; transition: border-color .15s ease, transform .15s ease; }

.thumb .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }

.body { padding: 12px; display: grid; gap: 8px; flex: 1; align-content: start; min-width: 0; }
.cat { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.name { font-weight: 600; line-height: 1.3; margin: 0; font-size: 0.95rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.price { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.price small { color: var(--muted); font-size: 0.78em; margin-left: 6px; }
.actions { padding: 0 12px 12px; display: grid; gap: 8px; }

.sub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ghost { padding: 9px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 0.84rem; font-weight: 600; width: 100%; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 6px; }
.ghost:hover { border-color: var(--muted); }
.ghost .n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--qc); }
.agents { position: relative; }
.agents summary { list-style: none; }
.agents summary::-webkit-details-marker { display: none; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 10; min-width: 180px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: grid; box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
.menu a { padding: 8px 10px; border-radius: 6px; text-decoration: none; font-size: 0.88rem; display: flex; justify-content: space-between; gap: 12px; }
.menu a:hover { background: var(--line); }
.menu .none { padding: 8px 10px; color: var(--muted); font-size: 0.82rem; max-width: 220px; }

.more { display: block; margin: -32px auto 56px; padding: 12px 28px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.more:hover { border-color: var(--muted); }
.empty { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: var(--r); padding: 40px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }
.empty a { color: var(--accent); }

.lb { position: fixed; inset: 0; z-index: 60; background: rgba(4, 5, 8, 0.94); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px); }
.lb-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-width: 0; }
.lb-title { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-title small { font-family: var(--font-mono); color: var(--qc); margin-left: 8px; font-weight: 500; }
.lb-stage { display: grid; place-items: center; min-height: 0; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.lb-none { text-align: center; display: grid; gap: 8px; justify-items: center; color: var(--muted); }
.lb-none strong { font-family: var(--font-display); font-size: 1.6rem; color: var(--fg); }
.lb-strip { display: flex; gap: 8px; overflow-x: auto; justify-content: center; }
.lb-strip button { flex: none; width: 56px; height: 56px; padding: 0; border-radius: 6px; overflow: hidden; border: 2px solid transparent; background: var(--surface-2); cursor: pointer; opacity: 0.6; }
.lb-strip button[aria-current="true"] { border-color: var(--qc); opacity: 1; }
.lb-strip img { width: 100%; height: 100%; object-fit: cover; }
.lb-btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; flex: none; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; padding: 0; }
.lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }

footer { border-top: 1px solid var(--line); padding-block: 22px; color: var(--muted); font-size: 0.85rem; }
footer .wrap { display: flex; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; }

@media (max-width: 520px) {
  .body { padding: 10px; }
  .actions { padding: 0 10px 10px; }
  .kako { font-size: 0.84rem; padding: 10px 6px; }
  .sub { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .ghost { font-size: 0.8rem; padding: 8px 6px; }
  .menu { left: 0; right: 0; min-width: 0; }
}

@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

<body>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#" id="brand">RepsRB<span>.finds</span></a>
    <div class="search"><input id="q" type="search" placeholder="Search finds…" aria-label="Search products"></div>

      <option value="default">Newest</option>
      <option value="asc">Price: low to high</option>
      <option value="desc">Price: high to low</option>

<main class="wrap">
  <section class="hero">
    <h1>Weidian finds, ready to buy on <em>Kakobuy</em></h1>
    <p>Every item links to its Weidian listing. Tap QC to see warehouse photos from real orders before you buy.</p>
    <div class="counts"><span><b id="c-items">0</b> items</span><span><b id="c-qc">0</b> with QC</span></div>
  </section>
  <nav class="chips" id="chips" aria-label="Categories"></nav>

  <button class="more" id="more" hidden>Show more</button>
</main>

<footer>
  <div class="wrap"><span>Links contain referral codes.</span><span>Prices in ¥ CNY from Weidian; USD is approximate.</span></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lb-title">

    <div class="lb-title" id="lb-title"></div>
    <button class="lb-btn" id="lb-close">Close</button>
  </div>
  <div class="lb-stage" id="lb-stage"></div>
  <div class="lb-strip" id="lb-strip"></div>
  <button class="lb-btn lb-nav prev" id="lb-prev" aria-label="Previous photo">‹</button>
  <button class="lb-btn lb-nav next" id="lb-next" aria-label="Next photo">›</button>
</div>

<script>
const CATEGORIES = ["Shoes", "T-Shirts", "Hoodies", "Jackets", "Pants", "Shorts", "Sets", "Jerseys", "Shirts", "Sweaters", "Hats", "Bags", "Accessories", "Socks", "Underwear", "Home", "[CHECK]"];
const PAGE = 60;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const itemId = url => (String(url).match(/itemI[Dd]=(\d+)/) || [])[1] || "";

function kakobuyLink(url) {
  return "https://www.kakobuy.com/item/details?url=" + encodeURIComponent(url) + "&affcode=" + KAKOBUY_AFFCODE;
}
function otherAgentLinks(url) {
  const id = itemId(url);
  return OTHER_AGENTS
    .filter(a => id || !a.template.includes("{id}"))
    .map(a => ({ name: a.name, href: a.template.replace("{id}", id).replace("{url}", encodeURIComponent(url)) }));
}

const items = PRODUCTS.map((p, i) => ({ ...p, i, qc: Array.isArray(p.qc) ? p.qc : [] }));
const state = { q: "", cat: "All", sort: "default", shown: PAGE };

function visible() {
  const q = state.q.trim().toLowerCase();
  const list = items.filter(p => (state.cat === "All" || p.category === state.cat) &&
    (!q || `${p.name} ${p.category}`.toLowerCase().includes(q)));
  if (state.sort === "asc") list.sort((a, b) => a.priceCNY - b.priceCNY);
  if (state.sort === "desc") list.sort((a, b) => b.priceCNY - a.priceCNY);
  return list;
}

function card(p) {
  const others = otherAgentLinks(p.url);
  const price = typeof p.priceCNY === "number"
    ? `¥${Math.round(p.priceCNY)}<small>≈ $${(p.priceCNY * CNY_TO_USD).toFixed(2)}</small>`
    : `<span style="color:var(--check)">[CHECK] price</span>`;
  return `<article class="card">
    <div class="thumb">
      ${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="${esc(p.name)}" referrerpolicy="no-referrer">` : `<div class="noimg">No photo [CHECK]</div>`}
      ${p.qc.length ? `<span class="tag qc">QC ${p.qc.length}</span>` : ""}
      ${p.check ? `<span class="tag chk" title="${esc(p.check)}">[CHECK]</span>` : ""}
    </div>
    <div class="body">
      <div class="cat">${esc(p.category)}</div>
      <h3 class="name"><a href="${esc(p.url)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(p.name)}</a></h3>
      <div class="price">${price}</div>
    </div>
    <div class="actions">
      <a class="kako" href="${esc(kakobuyLink(p.url))}" target="_blank" rel="noopener">Buy on Kakobuy ↗</a>
      <div class="sub">
        <button class="ghost" data-qc="${p.i}">QC <span class="n">${p.qc.length || "–"}</span></button>
        <details class="agents">
          <summary class="ghost">Other agents ▾</summary>
          <div class="menu">${others.length
            ? others.map(a => `<a href="${esc(a.href)}" target="_blank" rel="noopener">${esc(a.name)}<span>↗</span></a>`).join("")
            : `<div class="none">Needs a Weidian item link with an itemID.</div>`}</div>
        </details>
      </div>
    </div>
  </article>`;
}

function render() {
  const cats = ["All", ...CATEGORIES, ...new Set(items.map(p => p.category).filter(c => c && !CATEGORIES.includes(c)))];
  $("#chips").innerHTML = cats.map(c => {
    const n = c === "All" ? items.length : items.filter(p => p.category === c).length;
    return `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${esc(c)}<small>${n}</small></button>`;
  }).join("");
  const list = visible();
  $("#more").hidden = list.length <= state.shown;
  $("#more").textContent = `Show more (${list.length - state.shown} left)`;
  $("#grid").innerHTML = list.length ? list.slice(0, state.shown).map(card).join("") : !items.length
    ? `<div class="empty"><h2>No products added yet</h2>
        <p>Products from the store will appear here. Add them to the <code>PRODUCTS</code> list at the top of this file.</p>
        <a href="${esc(STORE_URL)}" target="_blank" rel="noopener">Open the Weidian store ↗</a></div>`
    : `<div class="empty"><h2>Nothing matches</h2><p>Try a different search or category.</p></div>`;
  $("#c-items").textContent = items.length;
  $("#c-qc").textContent = items.filter(p => p.qc.length).length;
}

/* QC lightbox */
let cur = null, idx = 0;
function openQC(i) {
  cur = items[i]; idx = 0;
  $("#lb-title").innerHTML = `${esc(cur.name)}<small>QC ${cur.qc.length}</small>`;
  drawQC(); $("#lb").hidden = false; document.body.style.overflow = "hidden"; $("#lb-close").focus();
}
function drawQC() {
  const has = cur.qc.length > 0;
  $("#lb-stage").innerHTML = has
    ? `<img src="${esc(cur.qc[idx])}" alt="QC photo ${idx + 1} of ${cur.qc.length}" referrerpolicy="no-referrer">`
    : `<div class="lb-none"><strong>No QC yet</strong><span>Nobody has shared QC photos for this item yet.</span></div>`;
  $("#lb-strip").innerHTML = cur.qc.map((u, k) => `<button data-k="${k}" aria-current="${k === idx}" aria-label="QC photo ${k + 1}"><img src="${esc(u)}" alt="" referrerpolicy="no-referrer"></button>`).join("");
  $("#lb-prev").hidden = $("#lb-next").hidden = cur.qc.length < 2;
}
function step(d) { if (cur.qc.length > 1) { idx = (idx + d + cur.qc.length) % cur.qc.length; drawQC(); } }
function closeQC() { $("#lb").hidden = true; document.body.style.overflow = ""; }

/* Events */
$("#q").addEventListener("input", e => { state.q = e.target.value; state.shown = PAGE; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; state.shown = PAGE; render(); });
$("#more").addEventListener("click", () => { state.shown += PAGE; render(); });
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) { state.cat = b.dataset.cat; state.shown = PAGE; render(); } });
$("#brand").addEventListener("click", e => { e.preventDefault(); state.q = ""; state.cat = "All"; state.shown = PAGE; $("#q").value = ""; render(); window.scrollTo(0, 0); });
$("#grid").addEventListener("click", e => { const b = e.target.closest("[data-qc]"); if (b) openQC(+b.dataset.qc); });
document.addEventListener("click", e => {
  document.querySelectorAll("details.agents[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
});
$("#grid").addEventListener("toggle", e => {
  if (e.target.open) document.querySelectorAll("details.agents[open]").forEach(d => { if (d !== e.target) d.open = false; });
}, true);
$("#lb-close").onclick = closeQC;
$("#lb-prev").onclick = () => step(-1);
$("#lb-next").onclick = () => step(1);
$("#lb-strip").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) { idx = +b.dataset.k; drawQC(); } });
$("#lb").addEventListener("click", e => { if (e.target.id === "lb" || e.target.id === "lb-stage") closeQC(); });
document.addEventListener("keydown", e => {
  if ($("#lb").hidden) return;
  if (e.key === "Escape") closeQC(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
});

render();
</script>
</body>
</html>
